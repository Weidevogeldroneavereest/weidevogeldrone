<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Weidevogeldrone Scan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      padding: 2em;
    }
    form {
      background: #fff;
      padding: 1.5em;
      border-radius: 8px;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, textarea, button {
      margin-top: 1em;
      width: 100%;
      padding: 0.7em;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #2980b9;
      color: white;
      border: none;
      cursor: pointer;
    }
    #status {
      margin-top: 1em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Scanregistratie</h2>

  <form id="logForm">
    <label>Naam:
      <input type="text" id="deviceName" required />
    </label>

    <label>Type registratie:
      <select id="typeRegistratie" required>
        <option value="">-- Kies type --</option>
        <option value="Weidevogels">Weidevogels</option>
        <option value="Reekalveren/hazen">Reekalveren/hazen</option>
        <option value="Hoornaars">Hoornaars</option>
        <option value="Overig">Overig</option>
        <option value="Test">Test</option>
      </select>
    </label>

    <label>Opmerkingen:
      <textarea id="opmerkingen" rows="3" placeholder="Extra informatie..."></textarea>
    </label>

    <button type="submit">Verstuur gegevens</button>
  </form>

  <p id="status"></p>

  <script>
    document.getElementById('logForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('deviceName').value;
      const type = document.getElementById('typeRegistratie').value;
      const note = document.getElementById('opmerkingen').value;

      const isoTime = new Date().toISOString();
      let lat = '', lon = '';

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async position => {
          lat = position.coords.latitude;
          lon = position.coords.longitude;
          await sendToSheet(name, isoTime, lat, lon, type, note);
        }, () => {
          document.getElementById('status').textContent = '📍 Locatie niet beschikbaar';
          sendToSheet(name, isoTime, '', '', type, note);
        });
      } else {
        document.getElementById('status').textContent = '🌐 Geolocatie niet ondersteund';
        sendToSheet(name, isoTime, '', '', type, note);
      }
    });

    async function sendToSheet(name, time, lat, lon, type, note) {
      const url = 'https://script.google.com/macros/s/AKfycbyVRTQro8syS_MB2Pw3Tt3nbW8bS4EpmjiFfPUZ8tZGqewnW1_EH94gKFa6w4D-bOcU/exec';

      const params = new URLSearchParams();
      params.append("naam", name);
      params.append("tijd", time);
      params.append("locatie", lat && lon ? `${lat},${lon}` : '');
      params.append("type", type);
      params.append("opmerkingen", note);

      try { 
        const response = await fetch(`${url}?${params}`, {
          method: 'GET',
          mode: 'no-cors',
          headers: {
            'X-Fetch-Location': 'true',
            'Accept': 'text/html'
          }
        });

        document.getElementById('status').textContent = '✅ Gegevens verstuurd';
      } catch (error) {
        document.getElementById('status').textContent = '❌ Fout bij verzenden';
      }
    }
  </script>
</body>
</html>
