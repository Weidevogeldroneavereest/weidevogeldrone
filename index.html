<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Weidevogel registratie</title>

  <style>
    /* ✔ Grote basislettergrootte voor alles */
    body { 
      font-family: Arial; 
      background: #f0f4f8; 
      padding: 2em; 
      font-size: 1.6em;
    }

    form { 
      background: #fff; 
      padding: 2.5em; 
      border-radius: 14px; 
      max-width: 550px; 
      margin: auto; 
    }

    /* ✔ Grote invulvelden */
    input, select, textarea, button {
      margin-top: 1.4em; 
      width: 100%; 
      padding: 1.2em; 
      border-radius: 10px; 
      border: 1px solid #ccc;
      font-size: 1.6em;
    }

    /* ✔ Grote labels, exact gelijk aan invulvelden */
    label {
      font-size: 1.6em;
      display: block;
      margin-top: 1.2em;
    }

    /* ✔ Forceer labeltekst gelijk aan veldtekst */
    label * {
      font-size: 1.6em !important;
    }

    /* ✔ Grote knop */
    button { 
      background-color: #2980b9; 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-size: 1.7em; 
      padding: 1em;
    }

    /* ✔ Mobielvriendelijk */
    @media (max-width: 600px) {
      body { font-size: 1.7em; }
      form { padding: 3em; }
      input, select, textarea, button { font-size: 1.7em; padding: 1.3em; }
      label { font-size: 1.7em; }
      label * { font-size: 1.7em !important; }
    }

    /* ✔ Gecentreerde banner */
    #status {
      text-align: center;
      margin-top: 1.5em;
      font-size: 1.6em;
      padding: 1em;
      border-radius: 10px;
      width: 100%;
      box-sizing: border-box;
      display: none;
    }

    /* ✔ Groene succesbanner */
    #status.success {
      background-color: #d4f8d4;
      color: #0a7a0a;
      border: 2px solid #0a7a0a;
      display: block;
    }

    /* ✔ Rode foutbanner */
    #status.error {
      background-color: #f8d4d4;
      color: #7a0a0a;
      border: 2px solid #7a0a0a;
      display: block;
    }

    /* ✔ Gele waarschuwing */
    #status.warning {
      background-color: #fff4c2;
      color: #7a6a00;
      border: 2px solid #7a6a00;
      display: block;
    }
  </style>
</head>

      <option value="Hoornaars">Hoornaars</option>
      <option value="Overig">Overig</option>
      <option value="Test">Test</option>
    </select>
  </label>

  <label>Opmerkingen:
    <textarea id="opmerkingen" rows="3"></textarea>
  </label>

  <button type="submit">Verstuur gegevens</button>
</form>

<p id="status"></p>
