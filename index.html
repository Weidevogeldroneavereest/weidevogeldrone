<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Weidevogel registratie</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      padding: 2em;
      margin: 0;
    }

    h2 {
      text-align: center;
      margin-bottom: 1em;
    }

    form {
      background: #ffffff;
      padding: 1.5em;
      border-radius: 10px;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    label {
      font-size: 1.2em;
      display: block;
      margin-top: 1em;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.9em;
      margin-top: 0.4em;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1.1em;
    }

    button {
      width: 100%;
      padding: 1em;
      margin-top: 1.5em;
      background-color: #2980b9;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.2em;
      cursor: pointer;
    }

    button:hover {
      background-color: #1f6a94;
    }

    /* ⭐ Terugmelding gecentreerd */
    #status {
      margin-top: 1.5em;
      font-size: 1.2em;
      padding: 0.8em;
      border-radius: 6px;
      max-width: 450px;
      margin-left: auto;
      margin-right: auto;
      background: #eef2f5;
      border-left: 4px solid #2980b9;
      text-align: center;
    }

    /* ⭐ Mobielvriendelijk */
    @media (max-width: 600px) {
      body { padding: 1em; }
      form { padding: 1.2em; }
      label { font-size: 1.3em; }
      input, select, textarea { font-size: 1.3em; padding: 1.1em; }
      button { font-size: 1.3em; padding: 1.1em; }
      #status { font-size: 1.3em; }
    }
  </style>
</head>

<body>

<h2>Scanregistratie</h2>

<form id="logForm">

  <label>Naam:
    <input type="text" id="deviceName" required />
  </label>

  <label>Type registratie:
    <select id="typeRegistratie" required>
      <option value="">-- Kies type --</option>
      <option value="Weidevogels">Weidevogels</option>
      <option value="Reekalveren/hazen">Reekalveren/hazen</option>
      <option value="Hoornaars">Hoornaars</option>
      <option value="Overig">Overig</option>
      <option value="Test">Test</option>
    </select>
  </label>

  <label>Opmerkingen:
    <textarea id="opmerkingen" rows="3"></textarea>
  </label>

  <button type="submit">Verstuur gegevens</button>
</form>

<p id="status"></p>

<script>
document.getElementById('logForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const status = document.getElementById('status');
  status.textContent = "";   // leegmaken

  const name = document.getElementById('deviceName').value.trim();
  const type = document.getElementById('typeRegistratie').value;
  const note = document.getElementById('opmerkingen').value.trim();
  const isoTime = new Date().toISOString();

  if (!name) {
    status.textContent = "Naam is verplicht";
    return;
  }

  if (!type) {
    status.textContent = "Type is verplicht";
    return;
  }

  let attempts = 0;
  let lat = null, lon = null, accuracy = null;

  function getGPS() {
    return new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(
        pos => resolve(pos),
        err => resolve(null),
        { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
      );
    });
  }

  while (attempts < 3 && lat === null) {
    const pos = await getGPS();
    if (pos) {
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
      accuracy = pos.coords.accuracy;
      if (!accuracy || accuracy > 100) accuracy = "";
    }
    attempts++;
  }

  if (!lat || !lon) {
    status.textContent = "GPS niet beschikbaar — registratie wordt zonder locatie verstuurd";
  }

  await sendToSheet(name, isoTime, lat, lon, accuracy, type, note);
});

async function sendToSheet(name, time, lat, lon, accuracy, type, note) {

  const url = "https://script.google.com/macros/s/AKfycbx_DvRgRYlYvMbqOIHaii_AYeWGpwElqVOgA0OmK9Efa80Cb3yz0GLZx02eAqq1Qa1b/exec";

  const params = new URLSearchParams();
  params.append("naam", name);
  params.append("tijd", time);
  params.append("locatie", lat && lon ? `${lat},${lon}` : "");
  params.append("accuracy", accuracy || "");
  params.append("type", type);
  params.append("opmerkingen", note);

  try {
    await fetch(`${url}?${params.toString()}`, { method: 'GET' });

    document.getElementById('status').textContent = "Gegevens verstuurd";

  } catch (error) {
    document.getElementById('status').textContent = "Fout bij verzenden";
  }
}
</script>

</body>
</html>
