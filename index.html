<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Weidevogel registratie</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Scanregistratie</h2>

<form id="logForm">

  <label>Naam:
    <input type="text" id="deviceName" required />
  </label>

  <label>Type registratie:
    <select id="typeRegistratie" required>
      <option value="">-- Kies type --</option>
      <option value="Weidevogels">Weidevogels</option>
      <option value="Reekalveren/hazen">Reekalveren/hazen</option>
      <option value="Hoornaars">Hoornaars</option>
      <option value="Overig">Overig</option>
      <option value="Test">Test</option>
    </select>
  </label>

  <label>Opmerkingen:
    <textarea id="opmerkingen" rows="3"></textarea>
  </label>

  <button type="submit">Verstuur gegevens</button>
</form>

<p id="status"></p>

<script src="script.js"></script>

</body>
</html>
