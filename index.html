<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Weidevogel registratie</title>

  <style>
    body { font-family: Arial; background: #f0f4f8; padding: 2em; }
    form { background: #fff; padding: 1.5em; border-radius: 8px; max-width: 450px; margin: auto; }
    input, select, textarea, button {
      margin-top: 1em; width: 100%; padding: 0.7em; border-radius: 4px; border: 1px solid #ccc;
    }
    button { background-color: #2980b9; color: white; border: none; cursor: pointer; }

    #status {
      text-align: center;
      margin-top: 1.5em;
      font-size: 1.3em;
      padding: 0.8em;
      border-radius: 6px;
      display: none;
    }

    #status.success {
      background-color: #d4f8d4;
      color: #0a7a0a;
      border: 1px solid #0a7a0a;
      display: block;
    }

    #status.error {
      background-color: #f8d4d4;
      color: #7a0a0a;
      border: 1px solid #7a0a0a;
      display: block;
    }

    #status.warning {
      background-color: #fff4c2;
      color: #7a6a00;
      border: 1px solid #7a6a00;
      display: block;
    }
  </style>
</head>

<body>

<h2 style="text-align:center;">Scanregistratie</h2>

<form id="logForm">

  <label>Naam:
    <input type="text" id="deviceName" required />
  </label>

  <label>Type registratie:
    <select id="typeRegistratie" required>
      <option value="">-- Kies type --</option>
      <option value="Weidevogels">Weidevogels</option>
      <option value="Reekalveren/hazen">Reekalveren/hazen</option>
      <option value="Hoornaars">Hoornaars</option>
      <option value="Overig">Overig</option>
      <option value="Test">Test</option>
    </select>
  </label>

  <label>Opmerkingen:
    <textarea id="opmerkingen" rows="3"></textarea>
  </label>

  <button type="submit">Verstuur gegevens</button>
</form>

<p id="status"></p>

<script>
document.getElementById('logForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const status = document.getElementById('status');
  status.className = "";
  status.style.display = "none";

  const name = document.getElementById('deviceName').value.trim();
  const type = document.getElementById('typeRegistratie').value;
  const note = document.getElementById('opmerkingen').value.trim();
  const isoTime = new Date().toISOString();

  if (!name) {
    status.textContent = "❌ Naam is verplicht";
    status.className = "error";
    return;
  }

  if (!type) {
    status.textContent = "❌ Type is verplicht";
    status.className = "error";
    return;
  }

  let attempts = 0;
  let lat = null, lon = null, accuracy = null;

  function getGPS() {
    return new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(
        pos => resolve(pos),
        err => resolve(null),
        { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
      );
    });
  }

  while (attempts < 3 && lat === null) {
    const pos = await getGPS();
    if (pos) {
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
      accuracy = pos.coords.accuracy;

      if (!accuracy || accuracy > 100) accuracy = "";
    }
    attempts++;
  }

  if (!lat || !lon) {
    status.textContent = "⚠️ GPS niet beschikbaar — registratie wordt zonder locatie verstuurd";
    status.className = "warning";
  }

  await sendToSheet(name, isoTime, lat, lon, accuracy, type, note);
});

async function sendToSheet(name, time, lat, lon, accuracy, type, note) {

  /* ⭐ JOUW EXACTE URL */
  const url = "https://script.google.com/macros/s/AKfycbx_DvRgRYlYvMbqOIHaii_AYeWGpwElqVOgA0OmK9Efa80Cb3yz0GLZx02eAqq1Qa1b/exec";

  const params = new URLSearchParams();
  params.append("naam", name);
  params.append("tijd", time);
  params.append("locatie", lat && lon ? `${lat},${lon}` : "");
  params.append("accuracy", accuracy || "");
  params.append("type", type);
  params.append("opmerkingen", note);

  try {
    await fetch(`${url}?${params.toString()}`, { method: 'GET' });

    const status = document.getElementById('status');
    status.textContent = "✅ Gegevens verstuurd";
    status.className = "success";

  } catch (error) {
    const status = document.getElementById('status');
    status.textContent = "❌ Fout bij verzenden";
    status.className = "error";
  }
}
</script>

</body>
</html>
