<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Weidevogel registratie</title>

  <style>
    body { font-family: Arial; background: #f0f4f8; padding: 2em; }
    form { background: #fff; padding: 1.5em; border-radius: 8px; max-width: 450px; margin: auto; }
    input, select, textarea, button {
      margin-top: 1em; width: 100%; padding: 0.7em; border-radius: 4px; border: 1px solid #ccc;
    }
    button { background-color: #2980b9; color: white; border: none; cursor: pointer; }

    /* ✔ Mobielvriendelijke velden */
    @media (max-width: 600px) {
      input, select, textarea, button { font-size: 1.3em; padding: 1em; }
      form { padding: 2em; }
      label { font-size: 1.2em; }
    }

    /* ✔ Gecentreerde banner */
    #status {
      text-align: center;
      margin-top: 1.5em;
      font-size: 1.3em;
      padding: 0.8em;
      border-radius: 6px;
      display: none; /* pas tonen wanneer nodig */
    }

    /* ✔ Groene succesbanner */
    #status.success {
      background-color: #d4f8d4;
      color: #0a7a0a;
      border: 1px solid #0a7a0a;
      display: block;
    }

    /* ✔ Rode foutbanner */
    #status.error {
      background-color: #f8d4d4;
      color: #7a0a0a;
      border: 1px solid #7a0a0a;
      display: block;
    }

    /* ✔ Gele waarschuwing (GPS niet beschikbaar) */
    #status.warning {
      background-color: #fff4c2;
      color: #7a6a00;
      border: 1px solid #7a6a00;
      display: block;
    }
  </style>
</head>

      <option value="Hoornaars">Hoornaars</option>
      <option value="Overig">Overig</option>
      <option value="Test">Test</option>
    </select>
  </label>

  <label>Opmerkingen:
    <textarea id="opmerkingen" rows="3"></textarea>
  </label>

  <button type="submit">Verstuur gegevens</button>
</form>

<p id="status"></p>
