<form id="logForm">
  <h2>Scanregistratie</h2>
  <label>Naam:
    <input type="text" id="deviceName" required />
  </label>
  <label>Opmerkingen:
    <textarea id="opmerkingen" placeholder="Vrije tekst..."></textarea>
  </label>
  <button type="submit">Verstuur gegevens</button>
  <p id="status"></p>
</form>

<script>
  document.getElementById('logForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const name = document.getElementById('deviceName').value;
    const opmerkingen = document.getElementById('opmerkingen').value;
    const isoTime = new Date().toISOString();
    let lat = '', lon = '';

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(async position => {
        lat = position.coords.latitude;
        lon = position.coords.longitude;
        await sendToSheet(name, isoTime, lat, lon, opmerkingen);
      }, () => {
        document.getElementById('status').textContent = '📍 Locatie niet beschikbaar';
        sendToSheet(name, isoTime, '', '', opmerkingen);
      });
    } else {
      document.getElementById('status').textContent = '🌐 Geolocatie niet ondersteund';
      sendToSheet(name, isoTime, '', '', opmerkingen);
    }
  });

  async function sendToSheet(name, time, lat, lon, opmerkingen) {
    const url = 'https://script.google.com/macros/s/AKfycbx_DvRgRYlYvMbqOIHaii_AYeWGpwElqVOgA0OmK9Efa80Cb3yz0GLZx02eAqq1Qa1b/exec';

    const params = new URLSearchParams();
    params.append("naam", name);
    params.append("tijd", time);
    params.append("locatie", lat && lon ? `${lat},${lon}` : '');
    params.append("opmerkingen", opmerkingen);

    try {
      const response = await fetch(`${url}?${params}`, {
        method: 'GET',
        mode: 'no-cors',
        headers: {
          'X-Fetch-Location': 'true',
          'Accept': 'text/html'
        }
      });
      if (response.ok != 0) {
        document.getElementById('status').textContent = '❌ Fout bij verzenden: ' + response.status;
      } else {
        document.getElementById('status').textContent = '✅ Gegevens verstuurd';
      }
    } catch (error) {
      document.getElementById('status').textContent = '❌ Fout bij verzenden: ' + error;
    }
  }
</script>
